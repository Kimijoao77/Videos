<style>
/* Layout: uma coluna larga e calma, abas grandes no topo, cartões por atividade com a cor de cada criação (igual à caderneta em papel). */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --gado: #C9B9DD; --gado-l: #2E2540; --porco: #F08AAB; --porco-l: #3A1E2B;

  --pos: #7FCB97; --neg: #F2928A; --warn-bg: #3A1E2B; --warn-ink: #F6C3D3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1A1424; --surface: #241C31; --ink: #EEE8F6; --muted: #B7AACB; --line: #382D48;
  --brand: #C9B9DD; --brand-ink: #2D2340; --brand-soft: #33284A; --accent: #F08AAB; --accent-ink: #2D2340;
  --gado: #C9B9DD; --gado-l: #2E2540; --porco: #F08AAB; --porco-l: #3A1E2B;

  --gado: #4F3964; --gado-l: #ECE6F4; --porco: #B52E58; --porco-l: #F8E4EC;

* { box-sizing: border-box; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 980px; margin: 0 auto; padding-block: 18px 48px; display: flex; flex-direction: column; gap: 18px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.cor .dots { display: flex; }
.cor .dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); }
.cor .dots i + i { margin-left: -7px; }

.tema .sw { width: 44px; height: 30px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 15px; }
.tema[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.status { width: 100%; display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
.status svg { font-size: 16px; color: var(--brand); }

.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tab { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: .95rem; }

.step { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.05rem; }
.step b { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .95rem; flex: none; }

/* atividades */
.ativs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ativ { --c: var(--brand); --l: var(--brand-soft); border: 3px solid var(--line); border-radius: 18px; background: var(--surface); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 800; text-align: center; }
.ativ .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--l); color: var(--c); display: grid; place-items: center; font-size: 38px; }
.ativ[aria-pressed="true"] { border-color: var(--c); background: var(--l); }
.ativ[aria-pressed="true"] .ic { background: var(--c); color: var(--surface); }
.t-gado { --c: var(--gado); --l: var(--gado-l); }

.field input { width: 100%; min-height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); padding: 10px 14px; font-size: 1.25rem; font-weight: 700; }
.money { position: relative; }
.money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 900; color: var(--muted); font-size: 1.15rem; }
.money input { padding-left: 52px; font-size: 1.6rem; }
.field.wide { grid-column: 1 / -1; }
.big { min-height: 64px; border: 0; border-radius: 18px; background: var(--brand); color: var(--brand-ink); font-size: 1.3rem; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; }
.big:disabled { opacity: .45; cursor: not-allowed; }
.big svg { font-size: 22px; }
.msg { min-height: 1.4em; font-weight: 800; margin: 0; }
.msg.ok { color: var(--pos); } .msg.err { color: var(--neg); }

/* lista de anotações */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; background: var(--l); color: var(--c); }
.row .what { min-width: 0; }
.row .what b { display: block; }
.row .what span { color: var(--muted); font-size: .88rem; }
.row .val { font-weight: 900; }
.val.in { color: var(--pos); } .val.out { color: var(--neg); }
.del { border: 0; background: transparent; color: var(--muted); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
.confirm { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 8px 12px; font-weight: 700; }
.confirm button { border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 800; }
.confirm .yes { background: var(--neg); color: #fff; } .confirm .no { background: var(--surface); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; }

/* mês / ano */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 800; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 12px 16px; font-weight: 700; display: flex; gap: 10px; align-items: flex-start; }
.banner svg { font-size: 20px; flex: none; margin-top: 3px; }
.acard { border-top: 8px solid var(--c); }
.ahead { display: flex; align-items: center; gap: 12px; }
.ahead .ic { width: 48px; height: 48px; border-radius: 50%; background: var(--l); color: var(--c); display: grid; place-items: center; font-size: 28px; flex: none; }
.ahead .res { margin-left: auto; text-align: right; }
.ahead .res small { display: block; color: var(--muted); font-size: .8rem; font-weight: 700; }
.ahead .res b { font-size: 1.25rem; }
.tots { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.tot { background: var(--l); border-radius: 12px; padding: 10px 12px; }
.tot small { display: block; font-weight: 700; color: var(--muted); font-size: .85rem; }
.tot b { font-size: 1.1rem; }
details summary { cursor: pointer; font-weight: 800; color: var(--c); padding: 6px 0; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; font-size: .85rem; width: 100%; }

th { background: var(--c); color: var(--surface); font-weight: 800; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
th:first-child { background: var(--c); color: var(--surface); }
td.z { color: var(--line); }
tr.total td { font-weight: 900; background: var(--l); }
tr.total td:first-child { background: var(--l); }
td.tt { background: var(--l); font-weight: 800; }

/* resumo */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.kpi small { display: block; color: var(--muted); font-weight: 800; font-size: .85rem; text-transform: uppercase; letter-spacing: .6px; }
.kpi b { font-size: 1.6rem; font-weight: 900; }

.geral td:first-child { display: flex; align-items: center; gap: 8px; }

.pos { color: var(--pos); } .neg { color: var(--neg); }

.bar .pair { display: flex; gap: 2px; align-items: flex-end; height: 150px; width: 100%; justify-content: center; }
.bar .pair i { display: block; width: 42%; max-width: 16px; border-radius: 4px 4px 0 0; min-height: 2px; }

.bar small { font-size: .72rem; color: var(--muted); font-weight: 800; }
.legend { display: flex; gap: 16px; font-size: .88rem; color: var(--muted); font-weight: 700; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* imprimir */
.prints { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.pbtn { border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; gap: 14px; align-items: flex-start; text-align: left; }
.pbtn .ic { width: 52px; height: 52px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 26px; flex: none; }
.pbtn b { display: block; font-size: 1.05rem; }
.pbtn span { color: var(--muted); font-size: .9rem; }
.pbtn:disabled { opacity: .5; cursor: not-allowed; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row2 select { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 6px 12px; font-weight: 800; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

@media (max-width: 700px) {
  body { font-size: 17px; }
  .tabs { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tab { font-size: .75rem; padding: 8px 2px; border-radius: 12px; }
  .ativs { grid-template-columns: repeat(2, 1fr); }
  .fields { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr; }

}
@media (prefers-reduced-motion: no-preference) {
  .tab, .ativ, .item, .chip, .big { transition: background-color .15s, border-color .15s, transform .1s; }
  .big:active:not(:disabled), .ativ:active, .item:active { transform: scale(.98); }

<div class="app">
  <header class="top">
    <div class="logo" id="logo"></div>
    <div class="brand"><h1>Caderneta Rural</h1><p>Gado, porcos, lavoura e casa num lugar só</p></div>
    <div class="yearbox" aria-label="Ano">
      <button class="iconbtn" id="yPrev" aria-label="Ano anterior"></button>

    <p class="status" id="status" role="status"></p>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <main id="main">
    <section id="v-anotar" class="stack"></section>
    <section id="v-mes" class="stack" hidden></section>
    <section id="v-ano" class="stack" hidden></section>

  </main>

  let cb = null, yr = null;

    kind: 'local', get ok() { return ok; },
    open(y, onData) { yr = y; cb = onData; onData(load(y)); return () => { cb = null; }; },
    async write(y, map) { save(y, map); if (cb && y === yr) cb({ ...map }); },
    async getYear(y) { return load(y); },
    years() { const ys = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(K)) ys.push(Number(k.slice(K.length))); } } catch {} Object.keys(mem).forEach(y => ys.includes(+y) || ys.push(+y)); return ys; },
  };
}
async function makeDb() {

  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return null;
  let uid = null; try { uid = await user.id(); } catch {}
  if (!uid) return null;

  const ref = y => db.doc(`data/users/${uid}/caderneta`).collection('anos').doc(String(y));

  doc.autoTable({ startY, head: [head], body, theme: 'grid', margin: { left: 12, right: 12 }, tableWidth: W,
    styles: { font: 'helvetica', fontSize: fs, cellPadding: 1.2, minCellHeight: rowH, valign: 'middle', halign: 'right', lineColor: a.light.map(x => Math.max(0, x - 28)), lineWidth: .2, textColor: [40, 40, 40] },
    headStyles: { fillColor: a.dark, textColor: 255, fontStyle: 'bold', halign: 'center', minCellHeight: 8 },

async function gerarPdf(tipo) {

      const rs = MESES.map((_, m) => resultadoMes(t, a, m)); body.push([a.id === 'casa' ? 'TOTAL' : 'TOTAL / RESULTADO', ...rs.map(fmtCell), nfmt.format(sum(rs))]);
      tabelaPdf(doc, a, 42, ['DESCRIÇÃO', ...MESES, 'TOTAL ANUAL'], body, a.itens.length > 4 ? 16 : 24, 8);
    }

    nova(); cabecalho(doc, ger, `Consolidação dos resultados e despesas da propriedade — ${S.year}`);
    const body = g.linhas.map(l => [l.nome, nfmt.format(l.ent), nfmt.format(l.sai), nfmt.format(l.ent - l.sai)]); body.push(['Diferença', nfmt.format(g.ent), nfmt.format(g.sai), nfmt.format(g.dif)]);

      styles: { font: 'helvetica', fontSize: 12, minCellHeight: 24, valign: 'middle', halign: 'right', lineColor: ger.light.map(x => Math.max(0, x - 28)), lineWidth: .2 },
      headStyles: { fillColor: ger.dark, textColor: 255, halign: 'left', minCellHeight: 10 }, columnStyles: { 0: { halign: 'left', fontStyle: 'bold', textColor: ger.dark, cellWidth: 70 } },

  } else {

      nova(); cabecalho(doc, a, `CONTROLE DIÁRIO — ${MESES[m]} de ${S.year}`, MESES[m].toUpperCase());
      const bloco = (de, ate, ultimo) => {
        const dias = []; for (let d = de; d <= ate; d++) dias.push(d);

        const body = a.itens.map(([it]) => { const row = [it, ...dias.map(d => fmtCell(t[a.id][it][m][d]))]; if (ultimo) row.push(nfmt.format(mesTotal(t, a.id, it, m))); return row; });
        const res = [a.id === 'casa' ? 'TOTAL' : 'TOTAL / RESULTADO', ...dias.map(d => fmtCell(resultadoDia(t, a, m, d)))]; if (ultimo) res.push(nfmt.format(resultadoMes(t, a, m)));

}

/* ---------- temas ---------- */
const TEMAS = [['auto', 'Automático', 'auto', 'linear-gradient(135deg,#F4F1F8 50%,#1A1424 50%)', '#4F3964'],
  ['claro', 'Claro', 'sun', '#F4F1F8', '#4F3964'], ['escuro', 'Escuro', 'moon', '#241C31', '#C9B9DD'], ['amoled', 'AMOLED', 'star', '#000000', '#F08AAB']];
const TEMA_KEY = 'cadernetaRuralTema';
let tema = 'auto'; try { tema = localStorage.getItem(TEMA_KEY) || 'auto'; } catch {}
/* paletas de cor: h = matiz da base, a = matiz do destaque, acts = matizes de gado, porcos, lavoura e casa */
const CORES = [
  { id: 'roxo', nome: 'Roxo e rosa', h: 271, s: 27, a: 342, as: 60, acts: [[271, 27], [342, 60], [262, 35], [320, 32]] },
  { id: 'verde', nome: 'Verde e amarelo', h: 145, s: 32, a: 43, as: 88, aL: 46, acts: [[145, 38], [32, 55], [95, 42], [175, 42]] },
  { id: 'azul', nome: 'Azul e laranja', h: 215, s: 40, a: 24, as: 85, acts: [[215, 45], [24, 75], [195, 55], [250, 35]] },
  { id: 'vinho', nome: 'Vinho e dourado', h: 345, s: 40, a: 40, as: 80, aL: 42, acts: [[345, 45], [25, 55], [40, 60], [300, 25]] },
  { id: 'terra', nome: 'Terra', h: 25, s: 35, a: 85, as: 45, acts: [[25, 45], [10, 50], [80, 40], [40, 30]] },
  { id: 'grafite', nome: 'Grafite', h: 215, s: 12, a: 190, as: 70, acts: [[215, 15], [190, 55], [150, 30], [260, 15]] },
];
const COR_KEY = 'cadernetaRuralCor';
let cor = 'roxo'; try { cor = localStorage.getItem(COR_KEY) || 'roxo'; } catch {}
const hsl = (h, s, l) => `hsl(${h} ${s}% ${l}%)`;
function hslRgb(h, s, l) { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l); const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return [f(0), f(8), f(4)].map(x => Math.round(x * 255)); }
const NOMES_ATIV = ['gado', 'porco', 'lavoura', 'casa'];
function modoEfetivo() {
  if (tema !== 'auto') return tema;
  const vt = document.documentElement.getAttribute('data-theme');
  if (vt === 'dark') return 'escuro'; if (vt === 'light') return 'claro';
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
}
function tokensCor(c, modo) {
  const t = {};
  if (modo === 'claro') {
    Object.assign(t, { '--bg': hsl(c.h, c.s + 5, 96), '--surface': '#FFFFFF', '--ink': hsl(c.h, c.s, 17), '--muted': hsl(c.h, Math.min(c.s, 14), 38), '--line': hsl(c.h, c.s, 88),
      '--brand': hsl(c.h, c.s + 5, 30), '--brand-ink': '#FFFFFF', '--brand-soft': hsl(c.h, c.s + 10, 92),
      '--accent': hsl(c.a, c.as, c.aL || 44), '--accent-ink': (c.aL || 44) > 44 ? hsl(c.h, c.s, 15) : '#FFFFFF',
      '--warn-bg': hsl(c.a, c.as, 94), '--warn-ink': hsl(c.a, c.as, 28) });
    c.acts.forEach(([h, s], i) => { t['--' + NOMES_ATIV[i]] = hsl(h, s, 36); t['--' + NOMES_ATIV[i] + '-l'] = hsl(h, s + 10, 93); });
  } else {
    const am = modo === 'amoled';
    Object.assign(t, { '--bg': am ? '#000000' : hsl(c.h, c.s, 10), '--surface': hsl(c.h, c.s, am ? 5 : 15), '--ink': hsl(c.h, 30, 94), '--muted': hsl(c.h, 14, 72), '--line': hsl(c.h, c.s, am ? 15 : 24),
      '--brand': hsl(c.h, Math.max(c.s, 30), 80), '--brand-ink': hsl(c.h, c.s, 12), '--brand-soft': hsl(c.h, c.s, am ? 10 : 22),
      '--accent': hsl(c.a, c.as, 72), '--accent-ink': hsl(c.h, c.s, 12), '--warn-bg': hsl(c.a, 35, am ? 9 : 18), '--warn-ink': hsl(c.a, 80, 85) });
    c.acts.forEach(([h, s], i) => { t['--' + NOMES_ATIV[i]] = hsl(h, Math.max(s, 35), 74); t['--' + NOMES_ATIV[i] + '-l'] = hsl(h, Math.min(s, 30), am ? 9 : 19); });

const CAMPOS_COR = ['--bg', '--surface', '--ink', '--muted', '--line', '--brand', '--brand-ink', '--brand-soft', '--accent', '--accent-ink', '--warn-bg', '--warn-ink', ...NOMES_ATIV.flatMap(n => ['--' + n, '--' + n + '-l'])];
function aplicarTema() {

  if (tema === 'auto') root.removeAttribute('data-tema'); else root.setAttribute('data-tema', tema);
  CAMPOS_COR.forEach(k => root.style.removeProperty(k));
  const c = CORES.find(x => x.id === cor) || CORES[0];
  if (c.id !== 'roxo') { const t = tokensCor(c, modoEfetivo()); for (const [k, v] of Object.entries(t)) root.style.setProperty(k, v); }
  const sw = x => `<span class="dots"><i style="background:${hsl(x.h, x.s + 5, 30)}"></i><i style="background:${hsl(x.a, x.as, x.aL || 44)}"></i><i style="background:${hsl(x.acts[2][0], x.acts[2][1], 40)}"></i></span>`;
  $('temaPanel').innerHTML = `<h3>Tema</h3><div class="tgrid">${TEMAS.map(([id, nome, ic, bg, fg]) => `<button class="tema" data-tema="${id}" aria-pressed="${tema === id}"><span class="sw" style="background:${bg};color:${fg}">${I[ic]}</span>${nome}</button>`).join('')}</div>
    <h3>Cor</h3><div class="cgrid">${CORES.map(x => `<button class="cor" data-cor="${x.id}" aria-pressed="${cor === x.id}">${sw(x)}${x.nome}</button>`).join('')}</div>`;
}
function corPdf(a) {

  if (c.id === 'roxo') return a;
  const i = NOMES_ATIV.indexOf(a.id); const [h, s2] = i >= 0 ? c.acts[i] : [c.h, c.s + 5];
  return { ...a, rgb: hslRgb(h, Math.max(s2, 25), i >= 0 ? 38 : 30), dark: hslRgb(h, Math.max(s2, 25), i >= 0 ? 26 : 20), light: hslRgb(h, s2 + 10, 94) };

try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => tema === 'auto' && aplicarTema()); } catch {}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'bTema') { const p = $('temaPanel'); p.hidden = !p.hidden; b.setAttribute('aria-expanded', String(!p.hidden)); }
  if (b.dataset.tema) { tema = b.dataset.tema; try { localStorage.setItem(TEMA_KEY, tema); } catch {} aplicarTema(); }
  if (b.dataset.cor) { cor = b.dataset.cor; try { localStorage.setItem(COR_KEY, cor); } catch {} aplicarTema(); }
});

/* ---------- início ---------- */
$('bTema').innerHTML = I.palette; aplicarTema();
$('logo').innerHTML = I.barn; $('yPrev').innerHTML = I.left; $('yNext').innerHTML = I.right; $('yLabel').textContent = S.year;
{ const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h)) S.view = h; }

  let store = null;
  try { store = await Promise.race([makeDb(), new Promise(r => setTimeout(() => r(null), 6000))]); } catch { store = null; }
  S.store = store || makeLocal(); S.ready = true;
  abrirAno(); render();
})();
</script>
