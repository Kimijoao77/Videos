# Lince Lunar: posta no YouTube um vídeo pronto do canal (16/11/2026: veio do repositório privado Engfy, que gastou os
# 2.000 minutos grátis do mês; aqui, no repositório público, os minutos são livres).
# O código, os roteiros e o estado (canal/lince/dados/canal.json) continuam no Engfy; o vídeo vem da Release dele.
# Pedido pelo app (Finanças → Canais → Lince): o app grava canal/lince/dados/pedido.json no Engfy e este fluxo confere
# a cada 10 minutos (o pedido vale por 2 h; vídeo já enviado não sobe de novo). À mão: Actions → Run workflow.
# Segredos deste repositório: ENGFY_TOKEN (já existia), YT_CLIENT_ID, YT_CLIENT_SECRET e YT_TOKEN_LINCE (a autorização do
# canal Lince Lunar). O registro mostra só o nome do vídeo e o link; as chaves ficam escondidas.
name: "Lince Lunar: postar"
run-name: "Lince Lunar: postar ${{ inputs.slug }} ${{ inputs.quando }}"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Vídeo (ex.: lince-as-meninas). Em branco = o pedido do app"
        required: false
        default: ""
      quando:
        description: "agora (público na hora), 18h (agendado para as 18:00 de Brasília), conferir (só testa a chave) ou cancelar"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: lince-postar
  cancel-in-progress: false

env:
  CANAL_REPO: Kimijoao77/Engfy
  CANAL_PUBLICO: "1"

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Código, roteiros e estado (repositório do canal)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANAL_REPO }}
          token: ${{ secrets.ENGFY_TOKEN }}
          sparse-checkout: |
            canal/lince/dados
            canal/lince/roteiros
            canal/lince/capas
      - name: Conferir as chaves (só se existem e têm o formato certo; nada delas aparece)
        if: github.event_name == 'workflow_dispatch'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_LINCE: ${{ secrets.YT_TOKEN_LINCE }}
        run: |
          python3 - <<'PY'
          import os, re
          def ver(nome, v, tipo):
              s = v.strip()
              if not s:
                  return f"{nome}: falta"
              nota = []
              if v != s: nota.append("tem espaço/Enter nas pontas (sem problema)")
              if any(q in s for q in "\"'"): nota.append("TEM ASPAS: cole sem as aspas")
              if " " in s or "\n" in s: nota.append("TEM ESPAÇO OU ENTER NO MEIO: cole numa linha só")
              if tipo == "id":
                  if s.startswith("GOCSPX-"): r = "ERRADO: aqui está a chave secreta (ID e chave trocados)"
                  elif re.fullmatch(r"\d+-[a-z0-9]+\.apps\.googleusercontent\.com", s): r = f"formato ok (termina em ...{s.split('.apps.')[0][-4:]}.apps.googleusercontent.com, para comparar com o Google Cloud)"
                  elif ".apps.googleusercontent.com" in s:
                      det = []
                      n = s.count(".apps.googleusercontent.com")
                      if n > 1: det.append(f"o ID aparece {n} vezes (colado repetido)")
                      if not s[0].isdigit(): det.append("tem algo ANTES do ID (ele começa com números)")
                      if not s.endswith(".apps.googleusercontent.com"): det.append("tem algo DEPOIS de .apps.googleusercontent.com")
                      if re.search(r"[A-Z]", s.split(".apps.")[0]): det.append("tem letra maiúscula (o ID é todo minúsculo)")
                      if re.search(r"[^a-z0-9.-]", s.lower()): det.append("tem símbolo estranho (:, =, / ou outro)")
                      r = "quase: " + ("; ".join(det) or "tem algo a mais ou a menos no ID")
                  else: r = "formato estranho (o ID termina com .apps.googleusercontent.com)"
              elif tipo == "chave":
                  if s.endswith(".apps.googleusercontent.com"): r = "ERRADO: aqui está o ID do cliente (ID e chave trocados)"
                  elif re.fullmatch(r"GOCSPX-[A-Za-z0-9_-]{20,40}", s): r = "formato ok"
                  elif "GOCSPX-" in s: r = "quase: tem algo a mais ou a menos em volta da chave"
                  else: r = "formato estranho (a chave secreta começa com GOCSPX-)"
              else:
                  if s.startswith("1//"): r = "formato ok"
                  elif s.startswith("4/"): r = "ERRADO: é o código de autorização (4/0...), não o refresh token (1//...)"
                  elif s.startswith("ya29."): r = "ERRADO: é o access token (ya29...), não o refresh token (1//...)"
                  else: r = "formato estranho (o refresh token começa com 1//)"
              return f"{nome}: {r}" + (f" [{'; '.join(nota)}]" if nota else "")
          for nome, var, tipo in (("YT_CLIENT_ID", "YT_CLIENT_ID", "id"), ("YT_CLIENT_SECRET", "YT_CLIENT_SECRET", "chave"), ("YT_TOKEN_LINCE", "YT_TOKEN_LINCE", "token")):
              print(ver(nome, os.environ.get(var, ""), tipo))
          PY
      - name: Postar
        env:
          GH_TOKEN: ${{ secrets.ENGFY_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_LINCE: ${{ secrets.YT_TOKEN_LINCE }}
          LINCE_SLUG: ${{ inputs.slug }}
          LINCE_QUANDO: ${{ inputs.quando }}
          LINCE_PEDIDO: canal/lince/dados/pedido.json
        run: python3 canal/lince/postar.py
