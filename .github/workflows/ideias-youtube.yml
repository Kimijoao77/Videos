# Buscador de ideias no YouTube rodando aqui (repositório público: minutos grátis). O código e os resultados ficam no
# repositório privado Engfy (ideias/youtube/); o registro público só mostra títulos de vídeos (que já são públicos).
# Segredos deste repositório: GEMINI_KEY (a chave do Gemini) e ENGFY_TOKEN (já existe). A lista de vídeos vem do yt-dlp.
# 11/11: todo dia de madrugada. Primeiro os vídeos novos dos canais; depois, com o que sobrar do limite do dia do
# Gemini, os antigos. Os novos vão para o Engfy assim que são assistidos (o Claude das 5h já acha).
name: Ideias do YouTube

on:
  workflow_dispatch:
    inputs:
      assistir:
        description: "Até quantos vídeos o Gemini assiste nesta rodada (para antes se acabar o limite do dia)"
        required: false
        default: "60"
  schedule:
    - cron: "17 4 * * *"   # 01:17 em Brasília, todo dia: às 5h a leitura do Claude dá o veredito dos que têm potencial

permissions:
  contents: read

concurrency:
  group: ideias-youtube
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kimijoao77/Engfy
          token: ${{ secrets.ENGFY_TOKEN }}
          sparse-checkout: ideias
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # o yt-dlp usa o Deno para ler o YouTube de hoje (legendas); se faltar, só a transcrição fica de fora
      - uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x
      - run: pip install -q requests "yt-dlp[default]"
      - name: Vídeos novos e antigos (Gemini)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          SALVAR_PARCIAL: "1"
          TEMPO_MAX_MIN: "150"
        run: |
          git config user.name "Kimijoao77"
          git config user.email "leclercjoao3@gmail.com"
          python ideias/youtube/buscar.py "${{ inputs.assistir || '60' }}"
      - name: Guardar no Engfy
        if: always()
        run: |
          git config user.name "Kimijoao77"
          git config user.email "leclercjoao3@gmail.com"
          git add ideias/youtube
          git diff --cached --quiet && exit 0
          git commit -q -m "Ideias do YouTube: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
