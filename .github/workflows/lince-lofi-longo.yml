# Vídeo longo do Lince Lofi (11/11/2026): o laço do lince (clipe do Flow emendado sem pulo, canal/pixel/lince) com
# lofi jazz feito por código (lofi_jazz_var.py: cada faixa com outro tom, andamento, melodia e instrumento; a primeira
# é a aprovada, "Lumi's Morning"). A trilha sai por código, o laço se repete sem recodificar (1,8 Mb/s: 2 h dão uns
# 1,8 GB, abaixo do limite de 2 GB da Release) e o vídeo e a lista de faixas vão para a Release privada "lince-lofi"
# do canal. Nada é postado.
name: Lince Lofi longo

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Duração mínima em minutos (a última faixa toca inteira)"
        required: false
        default: "120"
      nome:
        description: "Nome dos arquivos na Release"
        required: false
        default: "lince-lofi-manha"
      semente:
        description: "Primeira semente das faixas (outra semente = outras faixas)"
        required: false
        default: "100"
      laco:
        description: "Laço do vídeo (arquivo em canal/pixel/lince)"
        required: false
        default: "laco-manha.mp4"

permissions:
  contents: read

env:
  CANAL_REPO: Kimijoao77/Engfy

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.ENGFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CANAL_REPO }}
          token: ${{ secrets.ENGFY_TOKEN }}
          persist-credentials: false
          sparse-checkout: canal/pixel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy scipy pillow soundfile
      - name: Trilha (lofi jazz por código)
        run: cd canal/pixel && python musica_longa.py $(( ${{ inputs.minutos }} * 60 )) ../../musica.m4a $(nproc) ${{ inputs.semente }} lofi_jazz_var inteira
      - name: Juntar o laço com a trilha
        run: |
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 musica.m4a)
          echo "trilha: $dur s"
          mkdir -p envio
          ffmpeg -v error -y -stream_loop -1 -i "canal/pixel/lince/${{ inputs.laco }}" -i musica.m4a -t "$dur" \
            -map 0:v -map 1:a -c copy -movflags +faststart "envio/${{ inputs.nome }}.mp4"
          cp musica.json "envio/${{ inputs.nome }}-faixas.json"
          ls -la envio
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of compact "envio/${{ inputs.nome }}.mp4"
          tam=$(stat -c %s "envio/${{ inputs.nome }}.mp4")
          [ "$tam" -lt 2147000000 ] || { echo "o vídeo passou de 2 GB ($tam bytes): a Release não aceita"; exit 1; }
      - name: Mandar para a Release privada do canal
        run: |
          gh release view lince-lofi -R "$CANAL_REPO" > /dev/null 2>&1 || gh release create lince-lofi -R "$CANAL_REPO" --prerelease \
            --title "Lince Lofi" --notes "Vídeos longos do Lince Lofi: o lince na cabana com lofi jazz feito por código."
          for f in envio/*; do for i in 1 2 3; do gh release upload lince-lofi -R "$CANAL_REPO" "$f" --clobber && break; sleep 10; done; done
