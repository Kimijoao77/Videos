# Lince Lofi: posta no YouTube um vídeo pronto do canal ou só confere a chave (16/11/2026: veio do repositório privado
# Engfy, que gastou os 2.000 minutos grátis do mês; aqui, no repositório público, os minutos são livres).
# O código e o estado (canal/pixel/) continuam no Engfy; o vídeo vem da Release "lince-lofi" de lá.
# Pedido pelo app (Canais → Lofi): o app grava canal/pixel/dados/pedido.json no Engfy e este fluxo confere a cada
# 10 minutos (o pedido vale por 2 h; vídeo já enviado não sobe de novo). À mão: Actions → Run workflow.
# Segredos deste repositório: ENGFY_TOKEN (já existia) e YT_TOKEN_LOFI. O cliente OAuth é o mesmo do Lince (YT_CLIENT_ID e
# YT_CLIENT_SECRET); YT_CLIENT_ID_LOFI e YT_CLIENT_SECRET_LOFI só são usados se existirem (17/11/2026).
name: "Lince Lofi: postar"
run-name: "Lince Lofi: postar ${{ inputs.slug }} ${{ inputs.quando }}"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Vídeo (ex.: lince-lofi-manha). Em branco = o pedido do app"
        required: false
        default: ""
      quando:
        description: "agora (público na hora), 18h (agendado para as 18:00 de Brasília) ou conferir (só testa a chave)"
        required: false
        default: "conferir"

permissions:
  contents: read

concurrency:
  group: lofi-postar
  cancel-in-progress: false

env:
  CANAL_REPO: Kimijoao77/Engfy
  CANAL_PUBLICO: "1"

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Código e estado do canal (repositório do canal)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANAL_REPO }}
          token: ${{ secrets.ENGFY_TOKEN }}
          sparse-checkout: canal/pixel
      - name: Conferir as chaves (só se existem e têm o formato certo; nada delas aparece)
        if: github.event_name == 'workflow_dispatch'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_LOFI || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_LOFI || secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_LOFI: ${{ secrets.YT_TOKEN_LOFI }}
        run: |
          python3 - <<'PY'
          import os, re
          def ver(nome, v, tipo):
              s = v.strip()
              if not s:
                  return f"{nome}: falta"
              nota = []
              if v != s: nota.append("tem espaço/Enter nas pontas (sem problema)")
              if any(q in s for q in "\"'"): nota.append("TEM ASPAS: cole sem as aspas")
              if " " in s or "\n" in s: nota.append("TEM ESPAÇO OU ENTER NO MEIO: cole numa linha só")
              if tipo == "id":
                  if s.startswith("GOCSPX-"): r = "ERRADO: aqui está a chave secreta (ID e chave trocados)"
                  elif re.fullmatch(r"\d+-[a-z0-9]+\.apps\.googleusercontent\.com", s): r = "formato ok"
                  elif ".apps.googleusercontent.com" in s: r = "quase: tem algo a mais ou a menos em volta do ID"
                  else: r = "formato estranho (o ID termina com .apps.googleusercontent.com)"
              elif tipo == "chave":
                  if s.endswith(".apps.googleusercontent.com"): r = "ERRADO: aqui está o ID do cliente (ID e chave trocados)"
                  elif re.fullmatch(r"GOCSPX-[A-Za-z0-9_-]{20,40}", s): r = "formato ok"
                  elif "GOCSPX-" in s: r = "quase: tem algo a mais ou a menos em volta da chave"
                  else: r = "formato estranho (a chave secreta começa com GOCSPX-)"
              else:
                  if s.startswith("1//"): r = "formato ok"
                  elif s.startswith("4/"): r = "ERRADO: é o código de autorização (4/0...), não o refresh token (1//...)"
                  elif s.startswith("ya29."): r = "ERRADO: é o access token (ya29...), não o refresh token (1//...)"
                  else: r = "formato estranho (o refresh token começa com 1//)"
              return f"{nome}: {r}" + (f" [{'; '.join(nota)}]" if nota else "")
          for nome, var, tipo in (("YT_CLIENT_ID (do Lince ou _LOFI)", "YT_CLIENT_ID", "id"), ("YT_CLIENT_SECRET (do Lince ou _LOFI)", "YT_CLIENT_SECRET", "chave"), ("YT_TOKEN_LOFI", "YT_TOKEN_LOFI", "token")):
              print(ver(nome, os.environ.get(var, ""), tipo))
          PY
      - name: Postar
        env:
          GH_TOKEN: ${{ secrets.ENGFY_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_LOFI || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_LOFI || secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_LOFI: ${{ secrets.YT_TOKEN_LOFI }}
          LOFI_SLUG: ${{ inputs.slug }}
          LOFI_QUANDO: ${{ inputs.quando }}
        run: |
          pip install -q pillow
          python3 canal/pixel/postar.py
