# Problemas de tática do Lichess (domínio público, CC0) para o app de xadrez do Nexus. Roda só sob pedido: baixa a base
# inteira, escolhe ~10 mil problemas por tema e nível e deixa o arquivo como artefato (o Claude junta no app).
name: Xadrez (problemas do Lichess)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escolher os problemas
        run: |
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          python codigo/xadrez_lichess.py
      - uses: actions/upload-artifact@v4
        with:
          name: problemas-lichess
          path: saida/problemas-lichess.json
          retention-days: 7
