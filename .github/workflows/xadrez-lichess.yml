# Problemas de tática do Lichess (domínio público, CC0) para o app de xadrez do Nexus. Roda só sob pedido: baixa a base
# inteira, escolhe ~10 mil problemas por tema e nível e grava em xadrez/problemas-lichess.json (o Claude junta no app;
# os problemas são de domínio público, então podem ficar neste repositório público).
name: Xadrez (problemas do Lichess)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escolher os problemas
        run: |
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          python codigo/xadrez_lichess.py
      - name: Guardar no repositório
        run: |
          mkdir -p xadrez && cp saida/problemas-lichess.json xadrez/problemas-lichess.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xadrez/problemas-lichess.json
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -q -m "Xadrez: problemas do Lichess ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
